plugins {
    id 'java'
}

group = 'main'
version = ''

repositories {
    mavenCentral()
}

dependencies {
    implementation files('fastcgi-lib.jar')
}

jar{
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class' : 'Main'
    }

    from{
        configurations.runtimeClasspath.collect {it.isDirectory() ? it : zipTree(it)}
    }
}

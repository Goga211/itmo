plugins {
    id 'java'
    id 'war'
    id 'org.jetbrains.kotlin.jvm' version '1.9.23'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.0.21'
}

group = 'ru.mikhail'
version = '1.0-SNAPSHOT-KOTLIN'

repositories {
    mavenCentral()
}

// Версии библиотек
ext {
    junitVersion = '5.9.2'
    hibernateVersion = '6.6.1.Final'
    postgresqlVersion = '42.7.4'
    jakartaFacesVersion = '3.0.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Компилируем для Java 17 для совместимости с WildFly
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

dependencies {
    // Компиляция только интерфейсов (API)
    // Используем только API, реализацию предоставляет WildFly
    compileOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:3.0.0'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.0.0'
    compileOnly 'jakarta.faces:jakarta.faces-api:4.0.0'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    implementation 'jakarta.el:jakarta.el-api:6.0.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    // PostgreSQL драйвер
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation("org.eclipse.persistence:eclipselink:4.0.2")
    compileOnly("jakarta.platform:jakarta.jakartaee-web-api:10.0.0")

    // Kotlin Standard Library
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'

    // Тестирование JUnit
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"


    implementation 'org.mapstruct:mapstruct:1.6.3'

    // PrimeFaces - используем версию, совместимую с JSF 4.0
    // PrimeFaces 10.0.0:jakarta - первая версия с поддержкой Jakarta, может быть более стабильна
    implementation 'org.primefaces:primefaces:10.0.0:jakarta'

}

test {
    useJUnitPlatform()
}

kotlin {
    // Используемая версия JVM
    // Компилируем для Java 17 для совместимости с WildFly
    // Используем JDK 21 для компиляции, но target будет 17
    jvmToolchain(21)
}

// Настройка компиляции Kotlin для Java 17
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}
